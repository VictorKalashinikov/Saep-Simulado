    <script>

async function verificarAutenticacao() {

const { data, error } = await supabaseClient.auth.getUser();

if (error || !data.user) {
    window.location.href = "index.html";
    return;
}

console.log("Usuário autenticado:", data.user.email);
}

verificarAutenticacao();
