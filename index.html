<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - TechMaq</title>
</head>
<body>
    <h1>Login</h1>

    <!-- Formulário que dispara o evento de login -->
    <form id="formLogin">
        <label for="email">E-mail</label><br>
        <input type="email" id="email" required><br><br>

        <label for="senha">Senha</label><br>
        <input type="password" id="senha" required><br><br>

        <button type="submit">Entrar</button>
    </form>

    <br>
    <!-- Link de navegação para cadastro -->
    <a href="cadastro.html">Criar uma conta</a>

    <!-- Scripts carregados em ordem: Supabase CDN -> Configuração -> Lógica Principal -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
